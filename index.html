<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국뽕 감 테스트 — 당신의 애국심은 몇 점?</title>
<meta name="description" content="공개 데이터로 만든 추측 게임. 10개 주제, 주제당 5문항.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- 주제 고르기 ──────────────────────────────── -->
  <section id="view-home" class="view">
    <p id="shared-banner" class="banner" hidden></p>
    <div class="hero">
      <img class="hero-art" src="images/korea-flag-map.png" alt="" aria-hidden="true">
      <div class="badge-day">OPEN DATA</div>
      <h1 id="title"><span class="t-red">국</span><span class="t-blue">뽕</span><br>감&nbsp;테스트</h1>
      <p id="subtitle" class="muted"></p>
      <p class="lead">주제를 하나 고르세요. 5문항, 1분이면 끝납니다.</p>
    </div>
    <p id="progress-note" class="fineprint" style="text-align:left"></p>
    <div id="topic-grid" class="grid"></div>
    <button id="btn-grade" class="grade-btn" disabled>🏅 나의 대한민국 등급 확인하기
      <span id="grade-need" class="grade-need"></span></button>
    <p class="fineprint">모든 숫자는 공개 데이터에서 직접 계산했습니다.<br>
      정답 옆의 <b>근거 보기</b>를 누르면 어떻게 셌는지 나옵니다.</p>
  </section>

  <!-- 문항 ───────────────────────────────────── -->
  <section id="view-quiz" class="view" hidden>
    <button id="btn-back" class="linkish">← 주제 고르기</button>
    <p id="topic-name" class="muted small"></p>
    <div class="progress"><div id="progress-bar"></div></div>
    <p id="q-count" class="muted small"></p>
    <h2 id="q-text"></h2>
    <p id="q-unit" class="q-unit" hidden></p>

    <div id="q-choice" class="choices" hidden></div>

    <div id="q-slider" hidden>
      <output id="slider-out" class="slider-out"></output>
      <input type="range" id="slider" aria-label="추측 값">
      <div class="slider-ends"><span id="slider-min"></span><span id="slider-max"></span></div>
    </div>

    <button id="btn-next" class="primary" disabled>다음</button>
  </section>

  <!-- 나의 대한민국 등급 ───────────────────────── -->
  <section id="view-grade" class="view" hidden>
    <button id="btn-grade-back" class="linkish">← 주제 고르기</button>
    <div class="score-card">
      <div id="kgrade-letter" class="grade-letter"></div>
      <div id="kgrade-score" class="score"></div>
      <div id="kgrade-basis" class="score-max"></div>
      <div id="kgrade-name" class="grade"></div>
      <p id="kgrade-desc" class="grade-desc"></p>
    </div>
    <div class="card">
      <h3>주제별 점수</h3>
      <ul id="kgrade-list" class="grade-list"></ul>
    </div>
  </section>

  <!-- 결과 ───────────────────────────────────── -->
  <section id="view-result" class="view" hidden>
    <p id="result-topic" class="muted small"></p>
    <div class="score-card">
      <div id="grade-emoji" class="grade-emoji"></div>
      <div id="score" class="score"></div>
      <div id="score-max" class="score-max"></div>
      <div id="grade" class="grade"></div>
      <div id="result-counts" class="muted small" hidden></div>
    </div>

    <div id="ai-comment" class="ai" hidden></div>

    <div id="cards"></div>

    <div id="caveat" class="caveat" hidden></div>
    <p id="source" class="fineprint"></p>

    <div class="actions">
      <button id="btn-share" class="primary">친구에게 보내기</button>
      <button id="btn-retry" class="ghost">다시 도전하기</button>
      <button id="btn-more" class="ghost">다른 주제 풀기</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
